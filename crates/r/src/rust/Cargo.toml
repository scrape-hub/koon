[package]
name = "koon-r"
version = "0.5.6"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

# Regenerates R/extendr-wrappers.R from the compiled extendr metadata (see
# document.rs); run by Makevars/Makevars.win after every build, so
# `R CMD INSTALL`, `devtools::document()` and `rextendr::document()` all keep
# it in sync without a manual `.Call("wrap__make_koon_wrappers", ...)`. The
# `rlib` crate-type above is what lets this binary link the package's own
# code as an ordinary Rust dependency.
[[bin]]
name = "document"
path = "document.rs"

[dependencies]
# result_condition: a returned Err becomes an R condition object instead of a
# panic, which R/koon.R raises as a classed koon error.
extendr-api = { version = "0.8", features = ["result_condition"] }
# A copy of crates/core that bootstrap.R keeps in sync, so a source package
# built from crates/r contains it (koon-core lives outside the package).
koon-core = { path = "vendor/koon-core", features = ["doh"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

# koon's forks of quinn and h3 replace the crates.io releases, as in the
# workspace Cargo.toml (this crate is a workspace of its own).
[patch.crates-io]
quinn = { git = "https://github.com/scrape-hub/quinn.git", tag = "koon-1.0.0" }
quinn-proto = { git = "https://github.com/scrape-hub/quinn.git", tag = "koon-1.0.0" }
quinn-udp = { git = "https://github.com/scrape-hub/quinn.git", tag = "koon-1.0.0" }
h3 = { git = "https://github.com/scrape-hub/h3.git", tag = "koon-1.0.0" }
h3-quinn = { git = "https://github.com/scrape-hub/h3.git", tag = "koon-1.0.0" }
