[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "koon"
version = "1.0.1"
description = "Browser-impersonating HTTP client: TLS, HTTP/2 and HTTP/3 fingerprints of Chrome, Firefox, Safari, Edge, Opera, Brave, Samsung Internet and OkHttp. Passes Akamai and Cloudflare fingerprint checks."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "scrape-hub" }]
readme = "README.md"
keywords = [
    "tls-fingerprint",
    "browser-impersonation",
    "http2-fingerprint",
    "anti-bot",
    "web-scraping",
    "akamai",
    "cloudflare",
    "ja3",
    "ja4",
    "http-client",
    "proxy",
    "scraping",
    "stealth",
    "curl-impersonate",
    "boringssl",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Drop-in adapters: koon.httpx.KoonTransport and koon.requests.KoonAdapter.
httpx = ["httpx>=0.23"]
requests = ["requests>=2.26"]

[project.urls]
Homepage = "https://github.com/scrape-hub/koon"
Documentation = "https://github.com/scrape-hub/koon#quick-start"
Repository = "https://github.com/scrape-hub/koon"
Issues = "https://github.com/scrape-hub/koon/issues"
Changelog = "https://github.com/scrape-hub/koon/blob/master/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "koon._native"
python-source = "python"
# License notices of the compiled-in dependencies, generated by the release
# workflow (cargo-about, see about.toml). Listed explicitly because the file is
# gitignored, which maturin would otherwise skip.
include = [{ path = "python/koon/THIRD-PARTY-LICENSES.md", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires real internet access (deselected by default)",
]
addopts = "-m \"not network\""
