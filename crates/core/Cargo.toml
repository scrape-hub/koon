[package]
name = "koon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser-impersonating HTTP client: TLS, HTTP/2 and HTTP/3 fingerprints of Chrome, Firefox, Safari, Edge, Opera, Brave, Samsung Internet and OkHttp, checked against the real browsers."
repository = "https://github.com/scrape-hub/koon"
homepage = "https://github.com/scrape-hub/koon"
keywords = ["tls-fingerprint", "browser-impersonation", "anti-bot", "web-scraping", "http-client"]
categories = ["web-programming::http-client", "network-programming"]

[features]
default = ["socks", "doh"]
socks = ["dep:tokio-socks"]
doh = ["dep:hickory-proto", "dep:hickory-resolver"]
test-util = []

[dependencies]
btls = { git = "https://github.com/scrape-hub/btls.git", tag = "koon-2.0.0" }
tokio-btls = { git = "https://github.com/scrape-hub/btls.git", tag = "koon-2.0.0" }
quinn-btls = { git = "https://github.com/scrape-hub/btls.git", tag = "koon-2.0.0" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

http2 = { git = "https://github.com/scrape-hub/http2.git", tag = "koon-1.0.0", features = ["unstable"] }

http = "1"
bytes = "1"

tokio = { version = "1", features = ["net", "time", "rt", "rt-multi-thread", "macros"] }

tokio-socks = { version = "0.5", optional = true }

brotli = "8"
flate2 = "1"
zstd = "0.13"

webpki-root-certs = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

httparse = "1"

tungstenite = "0.24"
tokio-tungstenite = { version = "0.24", default-features = false }

futures-util = { version = "0.3", default-features = false, features = ["sink"] }

hickory-proto = { version = "0.25", optional = true }
hickory-resolver = { version = "0.25", optional = true, default-features = false, features = [
    "system-config",
    "tokio",
] }

rand = "0.9"

base64 = "0.22"

encoding_rs = "0.8"

url = "2"
percent-encoding = "2"
psl = "2"
thiserror = "2"
lru = "0.16"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
hickory-proto = "0.25"
toml = "0.9"
koon-core = { path = ".", features = ["test-util"] }
