# The fingerprints of the real browsers that `koon verify` and tests/fingerprint.rs compare a
# profile with, as tls.browserleaks.com and quic.browserleaks.com report them. A field left out is
# not checked. crates/core/tests/generated.rs writes src/verify/references.rs from this file
# (KOON_BLESS=1).
#
# `updated` is the day the entry last changed. `covers` says where a reference applies: a browser's
# versions `from` to `to` on the OS listed, ending at the last version whose fingerprint was
# verified (Safari's releases in src/profile/safari name their references themselves).
# `server_padding` names the reference a client in Chrome's PqcBandwidthExperiment field trial is
# compared with instead: the extension changes the JA4, the JA3N and the QUIC JA4.

