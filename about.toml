# psl compiles in the Public Suffix List (data/rules.txt, MPL-2.0), which its
# declared license does not cover. MPL-2.0 is accepted for psl only; any other
# MPL crate still fails the run. The crate has no MPL text, so cargo-about
# falls back to its built-in one; about.hbs prints the text from mozilla.org
# and the MPL 3.2 source notice in a fixed section instead.
[psl]
accepted = ["MPL-2.0"]

[psl.clarify]
license = "(MIT OR Apache-2.0) AND MPL-2.0"
[[psl.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "f09adf500d35265ee63ef552f8e61487e09ee549da66eaf0ec7924e3ad7cf14b"

