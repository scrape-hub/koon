# cargo-about configuration for THIRD-PARTY-LICENSES.md, the license notices
# shipped with the npm packages, the Python wheels, the CLI binaries and the R
# binary packages:
#
#   cargo about generate --fail -m crates/node/Cargo.toml -o THIRD-PARTY-LICENSES.md about.hbs
#
# (cargo-about 0.9 installs with `cargo install cargo-about --locked --features cli`.)
# The release workflow runs it for crates/node, crates/python and crates/cli, and
# with `-c about.toml` for crates/r/src/rust (a workspace of its own).
# Code and data that Cargo does not track (BoringSSL, the Chrome Root Store)
# are fixed sections of about.hbs.

# Licenses the dependency tree actually uses; anything else fails the run and
# needs a review. Order is priority: for "MIT OR Apache-2.0" MIT is chosen.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# The release targets.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Build scripts, bindgen and cmake are not part of the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# koon-r (publish = false) has no license field; the R package is MIT.
private = { ignore = true }

# Clarifications: crates whose license texts are not found by scanning the
# crate directory. A clarification is only used while every checksum matches;
# on a mismatch cargo-about warns ("failed to validate all files specified in
# clarification") and falls back to the canonical text without copyright
# lines, so review the changed file and update the checksum.
#
# Checksums are over the files as Git stores them (LF). A Windows checkout
# with CRLF line endings does not match; generate on Linux, as the release
# workflow does.

# koon's own crates: the LICENSE sits at the repository root.
[koon-core.clarify]
license = "MIT"
[[koon-core.clarify.files]]
path = "../../LICENSE"
checksum = "87f1cedcecadeba526a83385054db817d54d2fa580c78d5522f733fc54697b49"

