name: Release

on:
  push:
    tags: ["v*"]
    # A release branch runs every build job without publishing: the publish
    # jobs below run only for a v* tag or a manual run with a tag.
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.3)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Third-party license notices ────────────────────────────────────
  # THIRD-PARTY-LICENSES.md per distributable, from about.toml and about.hbs.
  # Generated on Linux: the checksums in about.toml are over LF files.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        run: |
          curl -sSL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C ~/.cargo/bin cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about

      - name: Generate notices
        run: |
          for crate in node python cli; do
            mkdir -p "notices/$crate"
            cargo about generate --fail -m "crates/$crate/Cargo.toml" \
              -o "notices/$crate/THIRD-PARTY-LICENSES.md" about.hbs
          done

      - name: Upload node notices
        uses: actions/upload-artifact@v7
        with:
          name: licenses-node
          path: notices/node/THIRD-PARTY-LICENSES.md

      - name: Upload python notices
        uses: actions/upload-artifact@v7
        with:
          name: licenses-python
          path: notices/python/THIRD-PARTY-LICENSES.md

      - name: Upload CLI notices
        uses: actions/upload-artifact@v7
        with:
          name: licenses-cli
          path: notices/cli/THIRD-PARTY-LICENSES.md

  # ─── Node.js binary (Windows x64) ───────────────────────────────────
  build-node-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: ./.github/actions/setup-windows

      - name: Build
        run: cargo build --release -p koon-node --target x86_64-pc-windows-msvc

      - name: Rename node binary
        shell: bash
        run: |
          cp "target/x86_64-pc-windows-msvc/release/koon_node.dll" \
             "crates/node/koon.win32-x64-msvc.node"

      - name: Upload node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-x86_64-pc-windows-msvc
          path: crates/node/koon.win32-x64-msvc.node

  # ─── Node.js binary (Linux x64) ─────────────────────────────────────
  build-node-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build
        run: cargo build --release -p koon-node --target x86_64-unknown-linux-gnu

      - name: Rename node binary
        run: |
          cp "target/x86_64-unknown-linux-gnu/release/libkoon_node.so" \
             "crates/node/koon.linux-x64-gnu.node"

      - name: Upload node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-x86_64-unknown-linux-gnu
          path: crates/node/koon.linux-x64-gnu.node

  # ─── Node.js binary (macOS arm64 / Apple Silicon) ──────────────────
  build-node-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: cargo build --release -p koon-node --target aarch64-apple-darwin

      - name: Rename node binary
        run: |
          cp "target/aarch64-apple-darwin/release/libkoon_node.dylib" \
             "crates/node/koon.darwin-arm64.node"

      - name: Upload node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-aarch64-apple-darwin
          path: crates/node/koon.darwin-arm64.node

  # ─── Node.js binary (macOS x64 / Intel) ───────────────────────────
  build-node-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: cargo build --release -p koon-node --target x86_64-apple-darwin

      - name: Rename node binary
        run: |
          cp "target/x86_64-apple-darwin/release/libkoon_node.dylib" \
             "crates/node/koon.darwin-x64.node"

      - name: Upload node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-x86_64-apple-darwin
          path: crates/node/koon.darwin-x64.node

  # ─── Python wheel (Windows x64) ─────────────────────────────────────
  build-python-windows:
    needs: licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download license notices
        uses: actions/download-artifact@v8
        with:
          name: licenses-python
          path: crates/python/python/koon/

      - uses: ./.github/actions/setup-windows

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --find-interpreter --manifest-path crates/python/Cargo.toml

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-x86_64-pc-windows-msvc
          path: dist/*.whl

  # ─── Python wheel (Linux x64, manylinux) ────────────────────────────
  build-python-linux:
    needs: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download license notices
        uses: actions/download-artifact@v8
        with:
          name: licenses-python
          path: crates/python/python/koon/

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter --manifest-path crates/python/Cargo.toml
          before-script-linux: |
            if command -v yum &>/dev/null; then
              yum install -y llvm-toolset-7.0-clang-devel || yum install -y clang-devel || true
              source /opt/rh/llvm-toolset-7.0/enable 2>/dev/null || true
            elif command -v apt-get &>/dev/null; then
              apt-get update && apt-get install -y libclang-dev
            fi
            curl -sL https://go.dev/dl/go1.24.1.linux-amd64.tar.gz | tar -C /usr/local -xzf -
            export PATH=$PATH:/usr/local/go/bin
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist/*.whl

  # ─── Python wheel (macOS arm64 / Apple Silicon) ───────────────────
  build-python-macos-arm64:
    needs: licenses
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download license notices
        uses: actions/download-artifact@v8
        with:
          name: licenses-python
          path: crates/python/python/koon/

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist --find-interpreter --manifest-path crates/python/Cargo.toml

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-aarch64-apple-darwin
          path: dist/*.whl

  # ─── Python wheel (macOS x64 / Intel) ────────────────────────────
  build-python-macos-x64:
    needs: licenses
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download license notices
        uses: actions/download-artifact@v8
        with:
          name: licenses-python
          path: crates/python/python/koon/

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-apple-darwin
          args: --release --out dist --find-interpreter --manifest-path crates/python/Cargo.toml

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-x86_64-apple-darwin
          path: dist/*.whl

  # ─── CLI binary (Windows x64) ──────────────────────────────────────
  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: ./.github/actions/setup-windows

      - name: Build
        run: cargo build --release -p koon-cli --target x86_64-pc-windows-msvc

      - name: Rename CLI binary
        shell: bash
        run: cp "target/x86_64-pc-windows-msvc/release/koon.exe" koon-windows-x64.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-x86_64-pc-windows-msvc
          path: koon-windows-x64.exe

  # ─── CLI binary (Linux x64) ───────────────────────────────────────
  build-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build
        run: cargo build --release -p koon-cli --target x86_64-unknown-linux-gnu

      - name: Rename CLI binary
        run: cp "target/x86_64-unknown-linux-gnu/release/koon" koon-linux-x64

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: koon-linux-x64

  # ─── CLI binary (macOS arm64 / Apple Silicon) ─────────────────────
  build-cli-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: cargo build --release -p koon-cli --target aarch64-apple-darwin

      - name: Rename CLI binary
        run: cp "target/aarch64-apple-darwin/release/koon" koon-macos-arm64

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-aarch64-apple-darwin
          path: koon-macos-arm64

  # ─── CLI binary (macOS x64 / Intel) ──────────────────────────────
  build-cli-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: cargo build --release -p koon-cli --target x86_64-apple-darwin

      - name: Rename CLI binary
        run: cp "target/x86_64-apple-darwin/release/koon" koon-macos-x64

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-x86_64-apple-darwin
          path: koon-macos-x64

  # ─── Python source distribution ────────────────────────────────────
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/python/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # ─── Publish to npm ─────────────────────────────────────────────────
  publish-npm:
    needs: [licenses, build-node-windows, build-node-linux, build-node-macos-arm64, build-node-macos-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Trusted publishing: npm mints a short-lived credential from the OIDC token
    # instead of a stored NPM_TOKEN. Each package must name this workflow as its
    # trusted publisher on npmjs.com.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Node 24: trusted publishing needs npm 11.5.1+, and current npm releases
      # refuse to install on Node 20.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Show npm version
        run: npm --version

      - name: Download node artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: artifacts/
          merge-multiple: true

      - name: List binaries
        run: ls -la artifacts/

      - name: Download license notices
        uses: actions/download-artifact@v8
        with:
          name: licenses-node
          path: notices/

      - name: Publish platform packages
        run: |
          cp artifacts/koon.win32-x64-msvc.node crates/node/npm/win32-x64-msvc/
          cp artifacts/koon.linux-x64-gnu.node crates/node/npm/linux-x64-gnu/
          cp artifacts/koon.darwin-arm64.node crates/node/npm/darwin-arm64/
          cp artifacts/koon.darwin-x64.node crates/node/npm/darwin-x64/
          for dir in crates/node/npm/*/; do
            echo "Publishing $(basename $dir)..."
            cp notices/THIRD-PARTY-LICENSES.md "$dir"
            npm publish "$dir" --access public
          done

      - name: Copy README into node package
        run: cp README.md crates/node/README.md

      - name: Publish main package
        run: npm publish --access public
        working-directory: crates/node

  # ─── Publish to PyPI ────────────────────────────────────────────────
  publish-pypi:
    needs: [build-python-windows, build-python-linux, build-python-macos-arm64, build-python-macos-x64, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Trusted publishing: PyPI accepts the OIDC token of this workflow in the
    # `pypi` environment (configured as the project's trusted publisher on
    # pypi.org) instead of a stored API token.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # ─── GitHub Release with binaries ───────────────────────────────────
  publish-github:
    needs: [licenses, build-node-windows, build-node-linux, build-node-macos-arm64, build-node-macos-x64, build-python-windows, build-python-linux, build-python-macos-arm64, build-python-macos-x64, build-cli-windows, build-cli-linux, build-cli-macos-arm64, build-cli-macos-x64, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release-files
          cp artifacts/node-*/*.node release-files/
          cp artifacts/cli-*/* release-files/
          cp artifacts/wheels-*/*.whl release-files/
          cp artifacts/sdist/*.tar.gz release-files/
          # The CLI binaries and .node files are bare assets; their notices
          # go next to them (the wheels carry their own).
          cp artifacts/licenses-cli/THIRD-PARTY-LICENSES.md release-files/THIRD-PARTY-LICENSES-cli.md
          cp artifacts/licenses-node/THIRD-PARTY-LICENSES.md release-files/THIRD-PARTY-LICENSES-node.md
          ls -la release-files/

      - name: Determine tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Delete existing release (if re-releasing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ steps.tag.outputs.name }} --yes --cleanup-tag=false 2>/dev/null || true

      # The release notes are the version's section of CHANGELOG.md.
      - name: Extract release notes
        run: |
          version="${{ steps.tag.outputs.name }}"
          awk -v v="## [${version#v}]" 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ steps.tag.outputs.name }} release-files/* --notes-file notes.md
