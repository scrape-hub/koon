name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One job per language, so that one binding's failure does not hide another's.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The default features include `doh`; the core also builds without it.
      - name: Run clippy without default features
        run: cargo clippy -p koon-core --no-default-features --features socks --all-targets -- -D warnings

      # The workspace's default member is koon-core only; koon-node and
      # koon-python are cdylibs tested by their own jobs below.
      - name: Run tests
        run: cargo test -p koon-core -p koon-cli

      # The README's examples, checked against the API they show (.github/readme/check.py).
      - name: README CLI flags
        run: python3 .github/readme/check.py cli target/debug/koon

      - name: README Rust examples
        run: |
          python3 .github/readme/check.py rust "$RUNNER_TEMP/readme-rs"
          cp Cargo.lock "$RUNNER_TEMP/readme-rs/"
          CARGO_TARGET_DIR=target cargo check --manifest-path "$RUNNER_TEMP/readme-rs/Cargo.toml"

  # The oldest Rust the README promises (Cargo.toml `rust-version`); the Node addon needs 1.88.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Check with Rust 1.85
        run: cargo check --locked -p koon-core -p koon-cli -p koon-python

  node:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-node-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-node-

      - name: Build the addon
        working-directory: crates/node
        run: npm run build

      - name: Run tests
        working-directory: crates/node
        run: npm run test:offline

      - name: README JavaScript examples
        if: matrix.runner == 'ubuntu-latest'
        run: |
          python3 .github/readme/check.py js "$RUNNER_TEMP/readme-js"
          cd "$RUNNER_TEMP/readme-js"
          npm install --silent --no-audit --no-fund typescript@5 @types/node@24
          npx tsc -p .

  python:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-python-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-python-

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # httpx and requests for the adapter tests, which skip without them.
      - name: Install maturin and pytest
        run: pip install maturin pytest httpx requests

      - name: Build the extension
        run: maturin develop --release --manifest-path crates/python/Cargo.toml

      # pyproject.toml deselects the tests marked `network`.
      - name: Run tests
        working-directory: crates/python
        run: pytest -q

      - name: README Python examples
        run: |
          pip install mypy
          python .github/readme/check.py python "$RUNNER_TEMP/readme-py"
          mypy --ignore-missing-imports --allow-redefinition "$RUNNER_TEMP/readme-py"

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only what the tests and the docs check need; the package itself has no R dependencies.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::processx, any::withr, any::jsonlite, any::roxygen2

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/r/src/rust/target
          key: ${{ runner.os }}-cargo-r-${{ hashFiles('crates/r/src/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-r-

      # fmt and clippy below need the copy of crates/core that bootstrap.R writes
      - name: Vendor koon-core
        working-directory: crates/r
        run: Rscript bootstrap.R

      # The R crate is a workspace of its own, outside `cargo fmt`/clippy above.
      - name: Check formatting
        run: cargo fmt --manifest-path crates/r/src/rust/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path crates/r/src/rust/Cargo.toml --all-targets -- -D warnings

      - name: Install the package
        run: R CMD INSTALL crates/r

      # The install regenerates R/extendr-wrappers.R; roxygen writes man/ from R/koon.R.
      - name: Generated R files are current
        run: |
          Rscript -e 'roxygen2::roxygenise("crates/r", load_code = roxygen2::load_installed)'
          git diff --exit-code crates/r/R/extendr-wrappers.R crates/r/man

      # Python is on the runner, so the tests against the local test server
      # (tests/testthat/testserver.py) run too.
      - name: Run tests
        run: Rscript -e 'testthat::test_local("crates/r", load_package = "installed", stop_on_failure = TRUE)'

      - name: README R examples
        run: |
          python3 .github/readme/check.py r "$RUNNER_TEMP/readme-r"
          Rscript "$RUNNER_TEMP/readme-r/check.R"
