name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One job per language, so that one binding's failure does not hide another's.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The workspace's default member is koon-core only; koon-node and
      # koon-python are cdylibs tested by their own jobs below.
      - name: Run tests
        run: cargo test -p koon-core -p koon-cli

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-node-

      - name: Build the addon
        working-directory: crates/node
        run: npm run build

      - name: Run tests
        working-directory: crates/node
        run: npm run test:offline

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-python-

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # httpx and requests for the adapter tests, which skip without them.
      - name: Install maturin and pytest
        run: pip install maturin pytest httpx requests

      - name: Build the extension
        run: maturin develop --release --manifest-path crates/python/Cargo.toml

      # pyproject.toml deselects the tests marked `network`.
      - name: Run tests
        working-directory: crates/python
        run: pytest -q

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only what the tests need; the package itself has no R dependencies.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::processx, any::withr, any::jsonlite

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/r/src/rust/target
          key: ${{ runner.os }}-cargo-r-${{ hashFiles('crates/r/src/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-r-

      # The R crate builds on a copy of crates/core (bootstrap.R); fmt and clippy
      # below need it, R CMD INSTALL refreshes it itself.
      - name: Vendor koon-core
        working-directory: crates/r
        run: Rscript bootstrap.R

      # The R crate is a workspace of its own, outside `cargo fmt`/clippy above.
      - name: Check formatting
        run: cargo fmt --manifest-path crates/r/src/rust/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path crates/r/src/rust/Cargo.toml --all-targets -- -D warnings

      - name: Install the package
        run: R CMD INSTALL crates/r

      # Python is on the runner, so the tests against the local test server
      # (tests/testthat/testserver.py) run too.
      - name: Run tests
        run: Rscript -e 'testthat::test_local("crates/r", load_package = "installed", stop_on_failure = TRUE)'
