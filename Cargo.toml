[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/node",
    "crates/python",
]
exclude = [
    "crates/r/src/rust",
]

default-members = ["crates/core"]

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.clippy]
type_complexity = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev.package.btls-sys]
opt-level = 3

[patch.crates-io]
quinn = { git = "https://github.com/scrape-hub/quinn.git", tag = "koon-1.0.0" }
quinn-proto = { git = "https://github.com/scrape-hub/quinn.git", tag = "koon-1.0.0" }
quinn-udp = { git = "https://github.com/scrape-hub/quinn.git", tag = "koon-1.0.0" }
h3 = { git = "https://github.com/scrape-hub/h3.git", tag = "koon-1.0.0" }
h3-quinn = { git = "https://github.com/scrape-hub/h3.git", tag = "koon-1.0.0" }
